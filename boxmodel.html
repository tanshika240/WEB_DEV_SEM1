<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Block and Inline Elements</title>
<style>
    .container {
        display: flex;
        justify-content: space-around;
        margin-top: 40px;
        font-family: Arial, sans-serif;
    }

    /* Block Section */
    .block-box {
        border: 3px solid #4a90e2;
        padding: 20px;
        border-radius: 12px;
        width: 200px;
        text-align: center;
    }

    .block-item {
        background: #dce9ff;
        border: 2px solid #4a90e2;
        padding: 15px;
        margin: 10px 0;
        border-radius: 10px;
        font-size: 18px;
    }

    /* Inline Section */
    .inline-box {
        border: 3px solid #f5b642;
        padding: 20px;
        border-radius: 12px;
        text-align: center;
        display: inline-block;
    }

    .inline-item {
        background: #fff2cf;
        border: 2px solid #f5b642;
        padding: 15px 25px;
        margin: 5px;
        border-radius: 10px;
        display: inline-block;
        font-size: 18px;
    }

    h2, h3 {
        text-align: center;
    }
</style>
</head>
<body>

<h2>Major Versions of HTML</h2>

<div class="container">

    <!-- Block Level -->
    <div>
        <div class="block-box">
            <div class="block-item">Box 1</div>
            <div class="block-item">Box 2</div>
            <div class="block-item">Box 3</div>
            <div class="block-item">Box 4</div>
        </div>
        <h3>Block-Level Element</h3>
    </div>

    <!-- Inline Level -->
    <div>
        <div class="inline-box">
            <span class="inline-item">Box 1</span>
            <span class="inline-item">Box 2</span>
            <span class="inline-item">Box 3</span>
            <span class="inline-item">Box 4</span>
        </div>
        <h3>Inline Element</h3>
    </div>

</div>

</body>
</html>
