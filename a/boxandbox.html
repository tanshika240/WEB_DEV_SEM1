<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Student Cards with Boxes</title>
<style>
  body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#f2f2f2;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
  }

  /* Main wrapper border */
  .outer-frame{
    border:3px solid #000;
    padding:40px;
    width:90%;
    max-width:1100px;
  }

  /* FLEXBOX ROW */
  .main-container{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:30px;
  }

  /* ─── Box for each card ─── */
  .box{
    width:260px;
    background:#fff;
    border-radius:10px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
    padding:20px;
    text-align:center;
    position:relative;
  }

  /* Avatar Circle */
  .avatar{
    width:70px;
    height:70px;
    border-radius:50%;
    background:#0d6efd;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
    font-size:18px;
    margin:0 auto 10px;
  }

  .name{
    font-weight:bold;
    font-size:16px;
    margin-top:10px;
  }

  .details{
    font-size:14px;
    color:#777;
    line-height:1.5;
    margin-top:8px;
  }
</style>
</head>

<body>
<div class="outer-frame">
  <div class="main-container">

    <!-- BOX 1 -->
    <div class="box">
      <div class="avatar">JK</div>
      <div class="name">Jeet Kumar</div>
      <div class="details">
        B.Tech - CSE <br>
        Roll No: 21CS1007 <br>
        1st Year
      </div>
    </div>

    <!-- BOX 2 -->
    <div class="box">
      <div class="avatar">AR</div>
      <div class="name">Asha Rani</div>
      <div class="details">
        B.Tech - IT <br>
        Roll No: 21IT1012 <br>
        1st Year
      </div>
    </div>

    <!-- BOX 3 -->
    <div class="box">
      <div class="avatar">RK</div>
      <div class="name">Rohit Kumar</div>
      <div class="details">
        B.Tech - ECE <br>
        Roll No: 21EC1009 <br>
        1st Year
      </div>
    </div>

  </div>
</div>
</body>
</html>
